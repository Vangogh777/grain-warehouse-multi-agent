<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>粮库数字孪生 · 3D 大屏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050810;overflow:hidden;font-family:'Segoe UI','PingFang SC',sans-serif;color:#c8d6e5;height:100vh}
#canvas3d{width:100vw;height:100vh;display:block}

/* Top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;
padding:12px 28px;background:linear-gradient(180deg,rgba(5,8,16,.95) 60%,transparent);pointer-events:none}
.topbar h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,#00d4ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.topbar .status{display:flex;align-items:center;gap:12px;font-size:11px;color:rgba(200,214,229,.3);pointer-events:none}
.topbar .status .live{width:6px;height:6px;border-radius:50%;background:#00ff88;box-shadow:0 0 10px #00ff8866;animation:pulse 1.5s infinite;display:inline-block;margin-right:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Stats bar */
.stats{position:fixed;top:52px;left:0;right:0;z-index:100;display:flex;gap:1px;padding:0 28px;pointer-events:none}
.stats .s{flex:1;background:rgba(8,14,30,.7);backdrop-filter:blur(8px);border:1px solid rgba(0,180,255,.06);padding:8px 14px;text-align:center}
.stats .s .sv{font-size:18px;font-weight:700;background:linear-gradient(135deg,#00d4ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stats .s .sl{font-size:10px;color:rgba(200,214,229,.3);margin-top:2px}

/* Info panel */
.panel{position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:100;width:260px;
background:rgba(8,14,30,.85);backdrop-filter:blur(12px);border:1px solid rgba(0,180,255,.08);border-radius:14px;padding:18px;
display:none;pointer-events:auto}
.panel.show{display:block;animation:slideIn .3s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(-50%) translateX(20px)}to{opacity:1;transform:translateY(-50%) translateX(0)}}
.panel .pt{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel .pd{font-size:12px;line-height:2}
.panel .pd .row{display:flex;justify-content:space-between;border-bottom:1px solid rgba(0,180,255,.04);padding:2px 0}
.panel .pd .row .rk{color:rgba(200,214,229,.4)}
.panel .pd .row .rv{font-weight:500}
.panel .close{position:absolute;top:10px;right:12px;background:none;border:none;color:rgba(200,214,229,.2);font-size:16px;cursor:pointer;pointer-events:auto}
.panel .close:hover{color:rgba(200,214,229,.6)}

/* Legend */
.legend{position:fixed;left:24px;bottom:30px;z-index:100;display:flex;gap:16px;align-items:center;
background:rgba(8,14,30,.7);backdrop-filter:blur(8px);padding:8px 16px;border-radius:8px;border:1px solid rgba(0,180,255,.06);font-size:11px;color:rgba(200,214,229,.4)}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend .lg .lb{width:12px;height:12px;border-radius:3px}

/* Mode switch */
.mode{position:fixed;left:24px;top:90px;z-index:100;display:flex;gap:8px}
.mode button{padding:6px 14px;border-radius:8px;border:1px solid rgba(0,180,255,.1);background:rgba(8,14,30,.7);color:rgba(200,214,229,.4);font-size:11px;cursor:pointer;transition:.2s;backdrop-filter:blur(8px)}
.mode button:hover{border-color:rgba(0,180,255,.25);color:#c8d6e5}
.mode button.active{background:rgba(0,180,255,.1);border-color:rgba(0,180,255,.2);color:#00d4ff}

/* Back button */
.back{position:fixed;left:24px;top:52px;z-index:100}
.back a{padding:6px 14px;border-radius:8px;border:1px solid rgba(0,180,255,.08);background:rgba(8,14,30,.5);color:rgba(200,214,229,.3);font-size:11px;text-decoration:none;transition:.2s}
.back a:hover{color:#c8d6e5;border-color:rgba(0,180,255,.15)}

/* Loading */
.loading{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:#050810;transition:opacity .8s;font-size:14px;color:rgba(200,214,229,.3)}
.loading.hide{opacity:0;pointer-events:none}
.loading .spinner{width:30px;height:30px;border:2px solid rgba(0,180,255,.1);border-top-color:#00d4ff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="loading" id="loading"><div class="spinner"></div>加载 3D 粮库场景...</div>

<div class="topbar">
  <h1>🌾 粮库数字孪生 · 3D 可视化</h1>
  <div class="status"><span><span class="live"></span>实时监测</span><span id="updateTime">—</span></div>
</div>

<div class="back"><a href="index.html">← 返回对话</a></div>

<div class="stats" id="statsBar"></div>

<div class="mode">
  <button class="active" data-view="temp">🌡 温度</button>
  <button data-view="humidity">💧 湿度</button>
  <button data-view="pest">🐛 虫害</button>
</div>

<div class="panel" id="infoPanel">
  <button class="close" id="panelClose">✕</button>
  <div class="pt" id="panelTitle">🏭 S-01</div>
  <div class="pd" id="panelData"></div>
</div>

<div class="legend">
  <div class="lg"><div class="lb" style="background:#00ff88"></div>正常</div>
  <div class="lg"><div class="lb" style="background:#ffd700"></div>关注</div>
  <div class="lg"><div class="lb" style="background:#ff6b35"></div>警告</div>
  <div class="lg"><div class="lb" style="background:#ff1744"></div>严重</div>
</div>

<canvas id="canvas3d"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ========== Config ==========
const API_URL = 'http://localhost:8000/api/query';
const SILO_COLS = 4;
const SILO_ROWS = 3;
const SPACING = 4.5;
const SILO_RADIUS = 1.5;
const SILO_HEIGHT = 4;

// ========== Scene Setup ==========
const canvas = document.getElementById('canvas3d');
const container = canvas.parentElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050810);
scene.fog = new THREE.Fog(0x050810, 20, 40);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(12, 10, 14);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

// ========== Controls ==========
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI / 2.1;
controls.target.set(0, 0.5, 0);

// ========== Lights ==========
const ambient = new THREE.AmbientLight(0x223355, 0.6);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffeedd, 1.8);
dirLight.position.set(10, 20, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x4488ff, 0.4);
fillLight.position.set(-5, 5, -10);
scene.add(fillLight);
const hemiLight = new THREE.HemisphereLight(0x4488ff, 0x002244, 0.3);
scene.add(hemiLight);

// ========== Ground ==========
const groundGeo = new THREE.PlaneGeometry(40, 40);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x080d1a, metalness: 0.3, roughness: 0.8,
  transparent: true, opacity: 0.6
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.1;
ground.receiveShadow = true;
scene.add(ground);

// Grid helper
const gridHelper = new THREE.GridHelper(30, 20, 0x0d1a33, 0x0d1a33);
gridHelper.position.y = 0;
scene.add(gridHelper);

// ========== Silo Data ==========
const siloMeshes = [];
const siloData = [];

// Silo IDs in grid layout
const siloIds = [];
for(let r=0;r<SILO_ROWS;r++) for(let c=0;c<SILO_COLS;c++) {
  const idx = r * SILO_COLS + c;
  siloIds.push(`S-${String(idx+1).padStart(2,'0')}`);
}

function getColorByTemp(temp, view='temp'){
  let t;
  if(view==='temp'){
    t=temp; // temperature
    if(t<25)return new THREE.Color(0x00ff88);
    if(t<30)return new THREE.Color(0x88ff00);
    if(t<35)return new THREE.Color(0xffd700);
    if(t<38)return new THREE.Color(0xff6b35);
    return new THREE.Color(0xff1744);
  }
  if(view==='humidity'){
    t=temp; // treat as humidity
    if(t<60)return new THREE.Color(0x00ff88);
    if(t<70)return new THREE.Color(0x88ff00);
    if(t<80)return new THREE.Color(0xffd700);
    return new THREE.Color(0xff6b35);
  }
  if(view==='pest'){
    t=temp; // treat as pest density
    if(t<3)return new THREE.Color(0x00ff88);
    if(t<6)return new THREE.Color(0x88ff00);
    if(t<10)return new THREE.Color(0xffd700);
    return new THREE.Color(0xff6b35);
  }
  return new THREE.Color(0x00ff88);
}

function getMetricColor(value, view){
  return getColorByTemp(value, view);
}

function buildSilos(data){
  // Clear old
  siloMeshes.forEach(m=>{scene.remove(m.mesh);scene.remove(m.label)});
  siloMeshes.length=0; siloData.length=0;

  const centerX = (SILO_COLS-1)*SPACING/2;
  const centerZ = (SILO_ROWS-1)*SPACING/2;
  const currentView = document.querySelector('.mode .active')?.dataset?.view||'temp';

  siloIds.forEach((sid,idx)=>{
    const r = Math.floor(idx/SILO_COLS);
    const c = idx%SILO_COLS;
    const x = c*SPACING - centerX;
    const z = r*SPACING - centerZ;

    const info = data[sid]||{temperature:{upper:25,lower:22},humidity:60,moisture:12,pest_density:2,co2_ppm:450};
    const tempVal = info.temperature?.upper||25;
    const color = getMetricColor(
      currentView==='temp'?tempVal:currentView==='humidity'?info.humidity:info.pest_density,
      currentView
    );

    // Silo body (cylinder)
    const geo = new THREE.CylinderGeometry(SILO_RADIUS, SILO_RADIUS*1.05, SILO_HEIGHT, 32);
    const mat = new THREE.MeshPhysicalMaterial({
      color: color, metalness: 0.1, roughness: 0.4,
      clearcoat: 0.15, transparent: true, opacity: 0.85,
      emissive: color.clone().multiplyScalar(0.08),
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, SILO_HEIGHT/2, z);
    mesh.castShadow = true;
    mesh.userData = {siloId:sid, idx};
    scene.add(mesh);

    // Silo roof
    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(SILO_RADIUS*0.9, 0.6, 32),
      new THREE.MeshPhysicalMaterial({color:0x1a2a4a,metalness:0.3,roughness:0.6})
    );
    roof.position.set(x, SILO_HEIGHT+0.3, z);
    scene.add(roof);

    // Rim ring
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(SILO_RADIUS*0.92, 0.05, 8, 32),
      new THREE.MeshPhysicalMaterial({color:0x2a3a5a,metalness:0.6,roughness:0.3})
    );
    ring.position.set(x, SILO_HEIGHT, z);
    ring.rotation.x = Math.PI/2;
    scene.add(ring);

    // Glow ring at base
    const glowRing = new THREE.Mesh(
      new THREE.RingGeometry(SILO_RADIUS*0.3, SILO_RADIUS*0.9, 32),
      new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.15, side:THREE.DoubleSide})
    );
    glowRing.position.set(x, 0.05, z);
    glowRing.rotation.x = -Math.PI/2;
    scene.add(glowRing);

    // Label (CSS2D)
    const labelDiv = document.createElement('div');
    labelDiv.textContent = sid;
    labelDiv.style.cssText = `color:rgba(200,214,229,.6);font-size:12px;font-weight:600;background:rgba(5,8,16,.7);padding:2px 10px;border-radius:4px;border:1px solid rgba(0,180,255,.1);backdrop-filter:blur(4px);letter-spacing:1px`;
    const label = new CSS2DObject(labelDiv);
    label.position.set(x, SILO_HEIGHT+1.2, z);
    scene.add(label);

    // Value label
    let valStr = currentView==='temp'?`${tempVal}°C`:currentView==='humidity'?`${info.humidity}%`:currentView==='pest'?`${info.pest_density}头/kg`:'';
    const valDiv = document.createElement('div');
    valDiv.textContent = valStr;
    valDiv.style.cssText = `color:${color.getStyle()};font-size:14px;font-weight:700;text-shadow:0 0 10px ${color.getStyle()}44`;
    const valLabel = new CSS2DObject(valDiv);
    valLabel.position.set(x, SILO_HEIGHT+0.3, z);
    scene.add(valLabel);

    // Bar indicator (CSS2D)
    const fillPct = currentView==='temp'?Math.min(tempVal/45,1):currentView==='humidity'?Math.min(info.humidity/100,1):Math.min((info.pest_density||0)/15,1);
    const barDiv = document.createElement('div');
    barDiv.style.cssText = `width:40px;height:4px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden`;
    barDiv.innerHTML = `<div style="width:${fillPct*100}%;height:100%;background:${color.getStyle()};border-radius:2px;transition:width .5s"></div>`;
    const barLabel = new CSS2DObject(barDiv);
    barLabel.position.set(x, 0.3, z);
    scene.add(barLabel);

    siloMeshes.push({mesh, label, sid, idx, data:info});
    siloData.push({sid, idx, x, z, info});
  });
}

// ========== Ambient particles ==========
const particleCount = 300;
const particleGeo = new THREE.BufferGeometry();
const pos = new Float32Array(particleCount*3);
for(let i=0;i<particleCount*3;i++) pos[i]=(Math.random()-0.5)*50;
particleGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
const particleMat = new THREE.PointsMaterial({
  color: 0x4488ff, size: 0.04, transparent: true, opacity: 0.3,
});
const particles = new THREE.Points(particleGeo, particleMat);
particles.position.y = 2;
scene.add(particles);

// ========== Fetch Data ==========
async function fetchSiloData(){
  const results = {};
  for(const sid of siloIds){
    try{
      const res = await fetch(API_URL, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({query:`查询${sid}仓的传感器数据`})
      });
      if(!res.ok) continue;
      const data = await res.json();
      // Parse temp from answer text
      const answer = data.answer||'';
      const upperMatch = answer.match(/上层[温度]{0,2}[:：]\s*([\d.]+)/);
      const middleMatch = answer.match(/中层[温度]{0,2}[:：]\s*([\d.]+)/);
      const lowerMatch = answer.match(/下层[温度]{0,2}[:：]\s*([\d.]+)/);
      const humMatch = answer.match(/[湿度]{1,2}[:：]\s*([\d.]+)/);
      const pestMatch = answer.match(/虫害[密度]{0,2}[:：]\s*([\d.]+)/);
      const moistMatch = answer.match(/水分[:：]\s*([\d.]+)/);
      const co2Match = answer.match(/CO.{0,1}[:：]\s*(\d+)/);

      // Fallback mock data for silos that fail
      const baseTemp = {'S-07':32.5,'S-03':25.2,'S-01':22.1,'S-02':23.5,'S-04':21.5,'S-05':24,'S-06':20.5,'S-08':19,'S-09':26.5,'S-10':23,'S-11':21,'S-12':24.5};
      const baseHum = {'S-03':73,'S-07':65,'S-01':62,'S-02':58,'S-04':55,'S-05':60,'S-06':52,'S-08':48,'S-09':70,'S-10':59,'S-11':54,'S-12':61};
      const basePest = {'S-03':7.2,'S-07':2.1,'S-01':1.2,'S-02':0.8,'S-04':0.5,'S-05':1.8,'S-06':0.3,'S-08':0.2,'S-09':3.5,'S-10':1,'S-11':0.6,'S-12':0.9};

      results[sid] = {
        temperature: {
          upper: upperMatch?parseFloat(upperMatch[1]):(baseTemp[sid]||22)+Math.random()*2-1,
          middle: middleMatch?parseFloat(middleMatch[1]):(baseTemp[sid]||22)*0.95+Math.random(),
          lower: lowerMatch?parseFloat(lowerMatch[1]):(baseTemp[sid]||22)*0.85+Math.random(),
        },
        humidity: humMatch?parseFloat(humMatch[1]):(baseHum[sid]||60)+Math.random()*2-1,
        moisture: moistMatch?parseFloat(moistMatch[1]):11.5+Math.random(),
        pest_density: pestMatch?parseFloat(pestMatch[1]):(basePest[sid]||1)+Math.random()*0.2,
        co2_ppm: co2Match?parseInt(co2Match[1]):400+Math.floor(Math.random()*200),
      };
    }catch(e){
      // Fallback
      const baseTemp = {'S-07':32.5,'S-03':25.2};
      results[sid] = {
        temperature:{upper:(baseTemp[sid]||22)+Math.random()*2-1,middle:(baseTemp[sid]||22)*0.95,lower:(baseTemp[sid]||22)*0.85},
        humidity:60+Math.random()*10, moisture:11.5+Math.random(), pest_density:1+Math.random(), co2_ppm:450+Math.floor(Math.random()*100)
      };
    }
  }
  return results;
}

async function updateScene(){
  const data = await fetchSiloData();
  buildSilos(data);

  // Update stats
  const vals = Object.values(data);
  const temps = vals.map(v=>v.temperature?.upper||0);
  const avgTemp = (temps.reduce((a,b)=>a+b,0)/temps.length).toFixed(1);
  const maxTemp = Math.max(...temps).toFixed(1);
  const totalPest = vals.reduce((a,v)=>a+(v.pest_density||0),0).toFixed(1);
  const criticalCount = temps.filter(t=>t>30).length;

  document.getElementById('statsBar').innerHTML = `
    <div class="s"><div class="sv">${avgTemp}°C</div><div class="sl">平均粮温</div></div>
    <div class="s"><div class="sv">${maxTemp}°C</div><div class="sl">最高粮温</div></div>
    <div class="s"><div class="sv">${totalPest}</div><div class="sl">虫害密度 (头/kg)</div></div>
    <div class="s"><div class="sv">${criticalCount}</div><div class="sl">高温预警仓</div></div>
    <div class="s"><div class="sv">${vals.length}</div><div class="sl">在线仓房</div></div>
  `;

  document.getElementById('updateTime').textContent = `更新: ${new Date().toLocaleTimeString()}`;
  document.getElementById('loading').classList.add('hide');
}

// ========== View Switch ==========
document.querySelectorAll('.mode button').forEach(btn=>{
  btn.addEventListener('click',async()=>{
    document.querySelector('.mode .active').classList.remove('active');
    btn.classList.add('active');
    document.getElementById('loading').classList.remove('hide');
    await updateScene();
  });
});

// ========== Raycaster for click ==========
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('click', (event)=>{
  pointer.x = (event.clientX/window.innerWidth)*2-1;
  pointer.y = -(event.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(pointer, camera);
  const meshes = siloMeshes.map(s=>s.mesh);
  const intersects = raycaster.intersectObjects(meshes);
  if(intersects.length>0){
    const obj = intersects[0].object;
    const sid = obj.userData.siloId;
    const d = siloMeshes.find(s=>s.sid===sid);
    if(!d) return;
    controls.autoRotate = false;
    const info = d.data;
    document.getElementById('panelTitle').innerHTML = `🏭 ${sid} 仓详情`;
    const v = info.temperature;
    document.getElementById('panelData').innerHTML = `
      <div class="row"><span class="rk">上层温度</span><span class="rv" style="color:${v.upper>30?'#ff6b35':v.upper>25?'#ffd700':'#00ff88'}">${v.upper?.toFixed(1)}°C</span></div>
      <div class="row"><span class="rk">中层温度</span><span class="rv">${v.middle?.toFixed(1)}°C</span></div>
      <div class="row"><span class="rk">下层温度</span><span class="rv">${v.lower?.toFixed(1)}°C</span></div>
      <div class="row"><span class="rk">湿度</span><span class="rv" style="color:${info.humidity>70?'#ff6b35':info.humidity>65?'#ffd700':'#00ff88'}">${info.humidity?.toFixed(1)}%RH</span></div>
      <div class="row"><span class="rk">水分</span><span class="rv">${info.moisture?.toFixed(1)}%</span></div>
      <div class="row"><span class="rk">虫害密度</span><span class="rv" style="color:${(info.pest_density||0)>10?'#ff1744':(info.pest_density||0)>5?'#ffd700':'#00ff88'}">${info.pest_density?.toFixed(1)} 头/kg</span></div>
      <div class="row"><span class="rk">CO₂</span><span class="rv">${info.co2_ppm} ppm</span></div>
    `;
    document.getElementById('infoPanel').classList.add('show');
  }
});

// Hover effect
renderer.domElement.addEventListener('mousemove', (event)=>{
  pointer.x = (event.clientX/window.innerWidth)*2-1;
  pointer.y = -(event.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(pointer, camera);
  const meshes = siloMeshes.map(s=>s.mesh);
  const intersects = raycaster.intersectObjects(meshes);
  renderer.domElement.style.cursor = intersects.length>0?'pointer':'default';
  siloMeshes.forEach(s=>{
    s.mesh.material.emissiveIntensity = 0.08;
    s.mesh.scale.set(1,1,1);
  });
  if(intersects.length>0){
    const obj = intersects[0].object;
    obj.material.emissiveIntensity = 0.3;
    obj.scale.set(1.02,1.02,1.02);
  }
});

document.getElementById('panelClose').addEventListener('click',()=>{
  document.getElementById('infoPanel').classList.remove('show');
  controls.autoRotate = true;
});

// ========== Window Resize ==========
window.addEventListener('resize',()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

// ========== Animation Loop ==========
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  particles.rotation.y += 0.0005;
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();

// ========== Init ==========
updateScene();
// Auto refresh every 30s
setInterval(updateScene, 30000);
</script>
</body>
</html>
