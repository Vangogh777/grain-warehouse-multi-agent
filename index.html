<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>粮库多智能体系统</title>
<style>
:root{
  --bg:#0f1a2e; --bg2:#141f38; --text:#dce6f0; --text2:rgba(200,214,229,.5);
  --border:rgba(0,180,255,.1); --border2:rgba(0,180,255,.06);
  --bub-bg:rgba(20,35,60,.7); --inp-bg:rgba(20,35,60,.6);
  --grid:rgba(0,180,255,.06); --accent:#40c8ff;
}
[data-theme="light"]{
  --bg:#ffffff; --bg2:#f0f4fa; --text:#1a2332; --text2:rgba(26,35,50,.55);
  --border:rgba(0,80,160,.15); --border2:rgba(0,80,160,.08);
  --bub-bg:#ffffff; --inp-bg:#ffffff;
  --grid:rgba(0,80,160,.05); --accent:#0066cc;
}
[data-theme="light"] .agent-chip{background:#ffffff}
[data-theme="light"] .network-canvas-wrap{background:#f8fafc}
[data-theme="light"] .chat-msgs{background:#ffffff}
[data-theme="light"] .quick{border-top-color:rgba(0,80,160,.06)}
[data-theme="light"] .inp{border-top-color:rgba(0,80,160,.06)}
[data-theme="light"] .msg.sys .bub code{background:rgba(0,100,200,.08);color:#004488}
[data-theme="light"] .msg .bub h1,.msg .bub h2,.msg .bub h3{color:#1a2332}
[data-theme="light"] .msg .bub strong{color:#1a2332}
[data-theme="light"] .msg.sys .conc{background:rgba(0,180,100,.06);border-color:rgba(0,180,100,.12);color:#1a6b44}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:rgba(0,80,160,.2)!important}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;height:100vh;overflow:hidden;font-size:15px}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--grid)1px,transparent 1px),linear-gradient(90deg,var(--grid)1px,transparent 1px);background-size:30px 30px;pointer-events:none;z-index:0}

.header{position:relative;z-index:10;padding:16px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:var(--bg2);backdrop-filter:blur(12px)}
.header h1{font-size:20px;font-weight:700;background:linear-gradient(135deg,#40c8ff,#40ffa0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.dot-live{width:7px;height:7px;border-radius:50%;background:#40ffa0;box-shadow:0 0 12px #40ffa088;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status .key{color:var(--text2);font-size:11px}

.main{position:relative;z-index:1;display:flex;height:calc(100vh - 54px)}

/* Left: Agent Network */
.network-panel{width:460px;min-width:220px;max-width:750px;display:flex;flex-direction:column;padding:18px;gap:14px;border-right:none}

/* Drag handle */
.splitter{width:4px;cursor:col-resize;background:var(--border2);flex-shrink:0;position:relative;transition:background .2s}
.splitter:hover,.splitter.active{background:var(--border)}
.splitter::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:32px;background:rgba(0,180,255,.15);border-radius:2px;transition:background .2s}
.splitter:hover::after,.splitter.active::after{background:rgba(0,180,255,.4)}
.panel-title{font-size:12px;color:var(--text2);letter-spacing:1px;font-weight:600}
.network-canvas-wrap{flex:1;background:var(--bg);border-radius:12px;border:1px solid var(--border);overflow:hidden;min-height:200px}
.network-canvas-wrap canvas{width:100%;height:100%;display:block}
.agent-strip{display:flex;gap:6px}
.agent-chip{flex:1;display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:10px;transition:.2s}
.agent-chip .dot{width:5px;height:5px;border-radius:50%}

/* Right: Chat */
.chat-panel{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-msgs{flex:1;overflow-y:auto;padding:18px 24px;display:flex;flex-direction:column;gap:14px;position:relative}
/* DAG Panel */
.dag-panel{display:none;position:absolute;top:10px;right:10px;z-index:50;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;width:240px;max-height:300px;overflow-y:auto;font-size:11px;backdrop-filter:blur(8px)}
.dag-panel.show{display:block;animation:in .3s}
.dag-panel .dag-title{font-size:11px;color:var(--text2);margin-bottom:8px;letter-spacing:.5px}
.dag-node{display:flex;align-items:center;gap:8px;padding:4px 0;position:relative}
.dag-node::before{content:'';position:absolute;left:7px;top:20px;width:2px;height:16px;background:var(--border2)}
.dag-node:last-child::before{display:none}
.dag-node .d-icon{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;flex-shrink:0}
.dag-node .d-icon.pending{background:var(--border2);color:var(--text2)}
.dag-node .d-icon.running{background:rgba(64,200,255,.2);color:#40c8ff;animation:pulse 1s infinite}
.dag-node .d-icon.done{background:rgba(64,255,160,.15);color:#40ffa0}
.dag-node .d-icon.err{background:rgba(255,80,80,.15);color:#ff5050}
.dag-node .d-text{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dag-node .d-text.active{color:var(--text);font-weight:600}
.dag-node .d-text.done{color:rgba(64,255,160,.7)}
.dag-node .d-stat{font-size:10px;color:var(--text2);margin-left:auto}

.chat-msgs::-webkit-scrollbar{width:4px}
.chat-msgs::-webkit-scrollbar-thumb{background:rgba(0,180,255,.15);border-radius:2px}
#historyPanel::-webkit-scrollbar{width:3px}
#historyPanel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
#historyPanel::-webkit-scrollbar-track{background:transparent}
.network-panel ::-webkit-scrollbar{width:3px}
.network-panel ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.network-panel ::-webkit-scrollbar-track{background:transparent}

.msg{max-width:90%;display:flex;gap:10px;animation:in .35s ease-out;flex-shrink:0}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.sys{align-self:flex-start}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.msg .av{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.msg.user .av{background:rgba(0,180,255,.15)}
.msg.sys .av{background:rgba(0,255,136,.1)}
.msg .bub{padding:14px 18px;border-radius:12px;font-size:15px;line-height:1.7}
.msg.user .bub{background:rgba(0,180,255,.08);border:1px solid rgba(0,180,255,.12);color:var(--text)}
.msg.sys .bub{background:var(--bub-bg);border:1px solid var(--border);color:var(--text)}
.msg .bub table{border-collapse:collapse;width:100%;margin:6px 0;font-size:12px}
.msg .bub th,.msg .bub td{padding:5px 8px;border:1px solid rgba(0,180,255,.1);text-align:center}
.msg .bub th{background:rgba(0,180,255,.08);color:#00d4ff;font-weight:600}
.msg .bub td{background:rgba(0,180,255,.02)}
.msg .bub code{background:rgba(0,180,255,.08);padding:1px 5px;border-radius:3px;font-size:12px;color:#00d4ff}
.msg .bub pre code{display:block;padding:8px 12px;background:rgba(0,0,0,.3);border:1px solid rgba(0,180,255,.06);border-radius:6px;overflow-x:auto}
.msg .bub h1,.msg .bub h2,.msg .bub h3{margin:8px 0 4px;color:#e0ecff}
.msg .bub h2{font-size:15px;border-bottom:1px solid rgba(0,180,255,.06);padding-bottom:4px}
.msg .bub h3{font-size:14px}
.msg .bub strong{color:#e0ecff}
.msg .bub hr{border:none;border-top:1px solid rgba(0,180,255,.06);margin:8px 0}

/* Reasoning steps inside bubble */
.steps{margin-top:8px;border-top:1px solid rgba(0,180,255,.08);padding-top:8px}
.step{display:flex;align-items:flex-start;gap:8px;padding:3px 0;font-size:12px;line-height:1.5;opacity:0;animation:fs .3s forwards}
.step .sn{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;margin-top:1px}
.step .sa{font-weight:600;margin-right:4px}
.step .st{color:rgba(0,180,255,.5);font-size:11px}
.step .sm{color:rgba(200,214,229,.65)}
@keyframes fs{to{opacity:1}}
.thinking-dots{color:rgba(200,214,229,.4);font-size:12px;animation:pulse 1.5s infinite}
.sys .conc{margin-top:8px;padding:8px 12px;border-radius:6px;background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.12);font-size:13px;color:#8fecb0;line-height:1.6}
.sys .conc::before{content:'✅ ';color:#00ff88;font-weight:600}
.sys .meta{display:flex;gap:10px;margin-top:6px;font-size:11px;color:rgba(200,214,229,.25)}

/* Typing */
.typing{display:none;gap:10px;align-items:center;padding:12px 16px;margin-bottom:4px;align-self:flex-start;border-radius:12px;background:var(--bub-bg);border:1px solid var(--border);max-width:90%}
.typing.show{display:flex}
.spinner{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.typing .tt{font-size:14px;color:var(--text2);font-weight:500}

/* Quick questions */
.quick{padding:6px 20px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid rgba(0,180,255,.04)}
.quick .qc{padding:7px 16px;border-radius:16px;background:rgba(0,180,255,.05);border:1px solid var(--border);font-size:13px;color:var(--text2);cursor:pointer;transition:.2s}
.quick .qc:hover{background:rgba(0,180,255,.1);color:var(--text);border-color:var(--border)}

/* Input */
.inp{display:flex;gap:8px;padding:10px 20px 14px;border-top:1px solid rgba(0,180,255,.04)}
.inp input{flex:1;padding:14px 18px;border-radius:10px;border:1px solid var(--border);background:var(--inp-bg);color:var(--text);font-size:15px;outline:none;transition:.2s}
.inp input::placeholder{color:rgba(200,214,229,.15)}
.inp input:focus{border-color:rgba(0,180,255,.25);box-shadow:0 0 12px rgba(0,180,255,.05)}
.inp button{padding:14px 26px;border:none;border-radius:10px;background:linear-gradient(135deg,#00b4ff,#0090dd);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.inp button:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,180,255,.2)}
.inp button:disabled{opacity:.3;cursor:not-allowed;transform:none}

@media(max-width:860px){.network-panel{width:100%;max-height:220px;border-right:none;border-bottom:1px solid rgba(0,180,255,.06)}.main{flex-direction:column}}
</style>
</head>
<body>

<div class="header">
  <h1>🌾 粮库多智能体系统</h1>
  <div class="status"><span class="dot-live"></span> 运行中 · <span class="key" id="apiStatus">后端未连接</span> · <a href="dashboard.html" style="color:rgba(0,180,255,.5);text-decoration:none;font-size:11px;margin-left:4px">🌐 3D 大屏</a></div>
  <div id="themeToggle" style="width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;background:rgba(0,180,255,.06);border:1px solid rgba(0,180,255,.08);margin-left:6px;transition:.2s;flex-shrink:0" onclick="switchTheme()" title="切换主题">🌙</div>
</div>

<div class="main">
  <div class="network-panel" id="networkPanel">
    <div class="panel-title">🎭 角色</div>
    <div id="roleStrip" style="display:flex;gap:6px;margin-bottom:6px"></div>
    <div class="panel-title">🤖 模型</div>
    <div class="model-select-wrap" style="position:relative;margin-bottom:6px">
      <div class="model-select-trigger" id="modelTrigger" style="display:flex;align-items:center;justify-content:space-between;padding:5px 10px;border-radius:8px;background:rgba(20,35,60,.6);border:1px solid rgba(0,180,255,.12);cursor:pointer;font-size:11px;transition:.2s" onclick="toggleModelList()">
        <span id="modelLabel">DeepSeek V3 快速</span>
        <span style="font-size:8px;color:rgba(200,214,229,.3)">▾</span>
      </div>
      <div id="modelList" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:50;background:#162240;border:1px solid rgba(0,180,255,.15);border-radius:8px;overflow:hidden;margin-top:2px;box-shadow:0 8px 24px rgba(0,0,0,.4)"></div>
    </div>
    <div class="panel-title" style="cursor:pointer;display:flex;justify-content:space-between" onclick="toggleHistory()">
      <span>📜 历史对话</span>
      <span id="historyToggle" style="font-size:9px;color:rgba(200,214,229,.3)">▾</span>
    </div>
    <div id="historyPanel" style="max-height:200px;overflow-y:auto;font-size:11px;margin-bottom:4px">
      <div id="sessionStrip" style="display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap"></div>
      <div id="historyList" style="display:flex;flex-direction:column;gap:3px"></div>
    </div>
    <div class="panel-title">⚡ AGENT 协同网络</div>
    <div class="network-canvas-wrap"><canvas id="netCanvas"></canvas></div>
    <div class="agent-strip" id="agentStrip"></div>
  </div>
  <div class="splitter" id="splitter"></div>
  <div class="chat-panel">
    <div class="chat-msgs" id="chatMsgs">
      <div class="dag-panel" id="dagPanel">
        <div class="dag-title">⚡ 推理链路</div>
        <div id="dagNodes"></div>
      </div>
    </div>
    <div class="quick" id="quickQs"></div>
    <div class="inp">
      <input id="chatInp" placeholder="输入问题，例如：S-07仓是否满足通风条件？" autofocus>
      <button id="sendBtn">发送</button>
    </div>
  </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/marked/11.0.0/marked.min.js"></script>
<script>
// ========== Config ==========
const API_HOST = (window.location.origin === 'null' || window.location.protocol === 'file:') ? 'http://localhost:8080' : window.location.origin;
const API_BASE = API_HOST + '/api';
const API_URL = API_BASE + '/query';
const API_STREAM = API_BASE + '/query/stream';

// ========== Theme Toggle ==========
(function(){
  const saved=localStorage.getItem('grain_theme');
  if(saved==='light'){document.body.setAttribute('data-theme','light');}
})();
function switchTheme(){
  const isLight=document.body.getAttribute('data-theme')==='light';
  if(isLight){
    document.body.removeAttribute('data-theme');
    localStorage.setItem('grain_theme','dark');
    document.getElementById('themeToggle').textContent='🌙';
  }else{
    document.body.setAttribute('data-theme','light');
    localStorage.setItem('grain_theme','light');
    document.getElementById('themeToggle').textContent='☀️';
  }
}
// Set initial icon
if(localStorage.getItem('grain_theme')==='light'){
  document.getElementById('themeToggle').textContent='☀️';
}

// ========== Model Selector ==========
const MODELS = [
  {id:'deepseek-chat',label:'DeepSeek Chat'},
  {id:'deepseek-v4-flash',label:'DeepSeek V4 Flash'},
  {id:'deepseek-v4-pro',label:'DeepSeek V4 Pro（推理模型）'},
  {id:'glm-5',label:'GLM-5（智谱）'},
  {id:'deepseek-ai/DeepSeek-V2.5',label:'DeepSeek V2.5（硅基流动）'},
];
let currentModel = 'deepseek-chat';

// ========== Role System ==========
const ROLES = [
  {id:'keeper',label:'保管员',icon:'🔧',color:'#ffa500'},
  {id:'manager',label:'科长',icon:'📋',color:'#a855f7'},
  {id:'inspector',label:'质检员',icon:'🧪',color:'#00b4ff'},
];
let currentRole = 'keeper';
// session 持久化到 localStorage，刷新不丢失
let sessionId = localStorage.getItem('grain_session_id');
if(!sessionId){
  sessionId = 'sess_' + Date.now();
  localStorage.setItem('grain_session_id', sessionId);
}

const AGENTS = [
  {id:0,name:'粮情分析',icon:'🌡',color:'#00b4ff'},
  {id:1,name:'智能作业',icon:'⚙',color:'#ffa500'},
  {id:2,name:'出入库',icon:'🚛',color:'#00ff88'},
  {id:3,name:'报表分析',icon:'📋',color:'#a855f7'},
  {id:4,name:'质量检测',icon:'🧪',color:'#ff6b6b'},
];

// ========== Splitter Drag ==========
(function(){
  const panel=document.getElementById('networkPanel');
  const splitter=document.getElementById('splitter');
  let dragging=false;
  splitter.addEventListener('mousedown',function(e){
    dragging=true;splitter.classList.add('active');
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    let w=e.clientX-splitter.getBoundingClientRect().width/2;
    w=Math.max(200,Math.min(600,w));
    panel.style.width=w+'px';
    // 触发 canvas 重绘
    if(typeof resize==='function')resize();
  });
  document.addEventListener('mouseup',function(){
    if(!dragging)return;
    dragging=false;splitter.classList.remove('active');
    document.body.style.cursor='';
    document.body.style.userSelect='';
  });
})();

// ========== Canvas =========="
const canvas = document.getElementById('netCanvas');
const ctx = canvas.getContext('2d');
let W,H,activeAgent=-1,animFrame;

function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  if(!r.width)return;
  canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;
  canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';
  ctx.scale(devicePixelRatio,devicePixelRatio);W=r.width;H=r.height;
}
resize();window.addEventListener('resize',resize);

function draw(){
  const r=canvas.parentElement.getBoundingClientRect();
  if(!r.width){animFrame=requestAnimationFrame(draw);return}
  resize();
  const cx=W*.48,cy=H*.48,orbit=Math.min(W,H)*.3,t=Date.now()/3000;
  ctx.clearRect(0,0,W,H);
  const nodes=AGENTS.map((a,i)=>{const an=-Math.PI/2+i*Math.PI/1.25;return{x:cx+Math.cos(an)*orbit,y:cy+Math.sin(an)*orbit*.85,r:34,id:i}});
  const center={x:cx,y:cy-4,r:40};
  for(const n of nodes){
    ctx.strokeStyle='rgba(0,180,255,.15)';ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(center.x,center.y);ctx.stroke();
    const fp=(Math.sin(t+n.id*2)+1)/2;
    ctx.fillStyle=n.id===activeAgent?'rgba(0,255,136,.5)':'rgba(0,180,255,.25)';
    ctx.beginPath();ctx.arc(n.x+(center.x-n.x)*fp,n.y+(center.y-n.y)*fp,2,0,Math.PI*2);ctx.fill();
  }
  for(const n of[...nodes,center]){
    const isC=n.id===undefined,agent=isC?null:AGENTS[n.id],isA=n.id===activeAgent;
    const pulse=isC?1:(1+Math.sin(Date.now()/1500+(n.id||0))*.05),rr=n.r*pulse;
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,rr*2);
    if(isC)g.addColorStop(0,`rgba(0,180,255,${isA?.1:.05})`);
    else{const rgb=agent.color==='#00b4ff'?'0,180,255':agent.color==='#ffa500'?'255,165,0':agent.color==='#00ff88'?'0,255,136':agent.color==='#a855f7'?'168,85,247':'255,107,107';g.addColorStop(0,`rgba(${rgb},${isA?.3:.15})`)}
    g.addColorStop(1,'rgba(0,180,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,rr*2,0,Math.PI*2);ctx.fill();
    const gd=ctx.createRadialGradient(n.x-rr*.2,n.y-rr*.2,0,n.x,n.y,rr);
    if(isC){gd.addColorStop(0,`rgba(0,180,255,${isA?.35:.2})`);gd.addColorStop(1,'rgba(0,180,255,.08)');ctx.strokeStyle=`rgba(0,180,255,${isA?.6:.35})`}
    else{const rgb=agent.color==='#00b4ff'?'0,180,255':agent.color==='#ffa500'?'255,165,0':agent.color==='#00ff88'?'0,255,136':agent.color==='#a855f7'?'168,85,247':'255,107,107';gd.addColorStop(0,`rgba(${rgb},${isA?.3:.12})`);gd.addColorStop(1,`rgba(${rgb},.03)`);ctx.strokeStyle=`rgba(${rgb},${isA?.6:.3})`}
    ctx.fillStyle=gd;ctx.lineWidth=isA?1.8:1;ctx.beginPath();ctx.arc(n.x,n.y,rr,0,Math.PI*2);ctx.fill();ctx.stroke();
    if(isA){ctx.strokeStyle='rgba(0,255,136,.2)';ctx.lineWidth=1;ctx.setLineDash([3,5]);ctx.beginPath();ctx.arc(n.x,n.y,rr+5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(isC){ctx.font='18px sans-serif';ctx.fillText('🧠',n.x,n.y-1);ctx.fillStyle='rgba(200,214,229,.35)';ctx.font='8px sans-serif';ctx.fillText('Orchestrator',n.x,n.y+15)}
    else{ctx.font='17px sans-serif';ctx.fillText(agent.icon,n.x,n.y-1);ctx.fillStyle=isA?agent.color:'rgba(200,214,229,.3)';ctx.font=isA?'bold 9px sans-serif':'8px sans-serif';ctx.fillText(agent.name,n.x,n.y+rr+10)}
  }

function escapeHtml(text){

// ========== DAG Panel ==========
let dagSteps=[];
function resetDag(){dagSteps=[];document.getElementById('dagNodes').innerHTML='';document.getElementById('dagPanel').classList.remove('show')}
function updateDag(type,data){
  const el=document.getElementById('dagNodes');
  if(!el)return;
  if(type==='plan'){resetDag();document.getElementById('dagPanel').classList.add('show')}
  if(type==='agent_start'){
    dagSteps.push({icon:'▶',cls:'running',text:data.agent,stat:'运行中'});
    renderDag(el);
  }
  if(type==='tool_calls'&&data.calls){
    for(const tc of data.calls){
      dagSteps.push({icon:'🔧',cls:'running',text:tc.tool,stat:tc.input});
      renderDag(el);
    }
  }
  if(type==='agent_done'){
    const idx=dagSteps.findLastIndex(s=>s.text===data.agent||s.cls==='running');
    if(idx>=0){dagSteps[idx].icon='✓';dagSteps[idx].cls='done';dagSteps[idx].stat=`${data.elapsed}s`}
    renderDag(el);
  }
  if(type==='conclusion'){
    dagSteps.push({icon:'✅',cls:'done',text:'最终结论',stat:''});
    renderDag(el);
  }
}
function renderDag(el){
  el.innerHTML=dagSteps.map(s=>`<div class="dag-node"><span class="d-icon ${s.cls}">${s.icon}</span><span class="d-text ${s.cls}">${s.text}</span><span class="d-stat">${s.stat}</span></div>`).join('');
}

let isComparing=false;
async function askCompare(query){
  if(isComparing)return;isComparing=true;
  addMsg('user',`🔄 对比模式: ${query}`);
  const models=['deepseek-chat','glm-5'];
  const labels=['DeepSeek','GLM-5'];
  const container=document.createElement('div');container.className='msg sys';
  container.innerHTML=`<div class="av" style="background:rgba(0,255,136,.1)">🧠</div><div class="bub"><div style="display:flex;gap:12px" id="compareContainer"></div></div>`;
  chatMsgs.appendChild(container);
  const cc=document.getElementById('compareContainer');
  for(let i=0;i<2;i++){
    const side=document.createElement('div');side.style.cssText='flex:1;border:1px solid var(--border);border-radius:8px;padding:10px';
    side.innerHTML=`<div style="font-size:11px;color:var(--text2);margin-bottom:6px">${labels[i]} <span id="cstat${i}" style="float:right">⏳</span></div><div id="cresult${i}" style="font-size:12px;line-height:1.5;color:var(--text2)">等待中...</div>`;
    cc.appendChild(side);
    // Fire request
    (async(idx)=>{
      try{
        const res=await fetch(API_STREAM,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,model:models[idx]})});
        const reader=res.body.getReader();const decoder=new TextDecoder();let buf='';
        document.getElementById(`cstat${idx}`).textContent='⏳';
        while(true){
          const {done,value}=await reader.read();if(done)break;
          buf+=decoder.decode(value,{stream:true});
          for(const part of buf.split('\n\n')){
            if(!part.startsWith('data: '))continue;
            try{
              const ev=JSON.parse(part.slice(6));
              if(ev.type==='conclusion'){
                document.getElementById(`cresult${idx}`).innerHTML=renderMd(ev.text.substring(0,500));
                document.getElementById(`cstat${idx}`).textContent='✅';
              }
            }catch(e){}
          }
          buf='';
        }
      }catch(e){document.getElementById(`cresult${idx}`).textContent='❌ 失败';document.getElementById(`cstat${idx}`).textContent='❌';}
    })(i);
  }
  isComparing=false;
  chatMsgs.scrollTop=chatMsgs.scrollHeight;
}

// ========== API Call (Streaming SSE) ==========
async function ask(query){
  if(!query.trim())return;
  addMsg('user',query);
  chatInp.value='';sendBtn.disabled=true;sendBtn.textContent='...';showTyping('🤔 分析问题中...');

  // Create streaming message container
  const sysMsg=document.createElement('div');sysMsg.className='msg sys';
  const stepsEl=document.createElement('div');stepsEl.className='steps';
  const concEl=document.createElement('div');concEl.className='conc';concEl.style.display='none';
  sysMsg.innerHTML=`<div class="av" style="background:rgba(0,255,136,.1)">🧠</div><div class="bub"><div style="font-size:12px;color:rgba(200,214,229,.35);margin-bottom:6px">⚡ 多 Agent 协同推理</div></div>`;
  sysMsg.querySelector('.bub').appendChild(stepsEl);
  sysMsg.querySelector('.bub').appendChild(concEl);
  chatMsgs.appendChild(sysMsg);chatMsgs.scrollTop=chatMsgs.scrollHeight;
  let thinkInd=null;
let currentRid='';

  function addStep(icon,iconBg,iconColor,label,msg,color){
    const d=document.createElement('div');d.className='step';d.style.animationDelay='0s';
    d.innerHTML=`<span class="sn" style="background:${iconBg};color:${iconColor}">${icon}</span><span>${label?`<span class="sa" style="color:${color||'#c8d6e5'}">${label}</span> `:''}${msg?`<div class="sm">${msg}</div>`:''}</span>`;
    stepsEl.appendChild(d);
  }

  try{
    const res=await fetch(API_STREAM,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query,role:currentRole,session_id:sessionId,model:currentModel})
    });
    hideTyping();
    if(!res.ok)throw new Error(`HTTP ${res.status}`);

    const reader=res.body.getReader();
    const decoder=new TextDecoder();
    let buffer='';

    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const parts=buffer.split('\n\n');
      buffer=parts.pop()||'';
      for(const part of parts){
        if(!part.startsWith('data: '))continue;
        try{
          const ev=JSON.parse(part.slice(6));
          switch(ev.type){
            case 'plan':
              currentRid=ev.request_id;
              addStep('📋','rgba(0,180,255,.1)','#00d4ff','Orchestrator',`🎯 ${ev.scenario} · 请求 ${ev.request_id}${ev.role?' · '+ev.role:''}${ev.role?' · 🤖 '+currentModel:''}`,'#00d4ff');
              break;
            case 'step':
              addStep(`S${ev.step}`,'rgba(0,255,136,.1)','#00ff88','',`${ev.mode} · ${ev.desc}`,'#00ff88');
              break;
            case 'agent_start':{
              updateDag('agent_start',ev);const a=AGENTS.find(x=>x.name===ev.agent);
              addStep('▶',a?a.color+'22':'rgba(0,180,255,.1)',a?a.color:'#00d4ff',ev.agent,ev.task,a?a.color:'#00d4ff');
              if(a)flashAgent(a.id);
              chatMsgs.scrollTop=chatMsgs.scrollHeight;break;
            }
            case 'tool_calls':
              if(thinkInd){thinkInd.remove();thinkInd=null;}
              updateDag('tool_calls',ev);
              for(const tc of ev.calls)
                addStep('🔧','transparent','rgba(0,180,255,.4)','',`${tc.tool}(${tc.input})`,'rgba(0,180,255,.5)');
              chatMsgs.scrollTop=chatMsgs.scrollHeight;break;
            case 'agent_done':
              clearFlash();
              if(thinkInd){thinkInd.remove();thinkInd=null;}
              updateDag('agent_done',ev);
              addStep('✓','rgba(0,255,136,.1)','#00ff88','',`${ev.agent} 完成 (${ev.elapsed}s, ${ev.tool_count}次)`,'rgba(200,214,229,.4)');
              showTyping('✅ '+ev.agent+' 完成');
              chatMsgs.scrollTop=chatMsgs.scrollHeight;break;
            case 'thinking':{
              if(!thinkInd){
                thinkInd=document.createElement('div');thinkInd.className='step';thinkInd.style.animationDelay='0s';
                stepsEl.appendChild(thinkInd);
              }
              const a=AGENTS.find(x=>x.name===ev.agent);
              const taskText=ev.task?' · '+ev.task:'';
              showTyping('⏳ '+ev.agent+taskText);
              tip.innerHTML=`<span class="sn" style="background:${a?a.color+'22':'rgba(0,180,255,.1)'};color:${a?a.color:'#00d4ff'}"><div class="spinner" style="width:10px;height:10px;border-width:1.5px;border-color:${a?a.color+'44':'rgba(0,180,255,.3)'};border-top-color:${a?a.color:'#00d4ff'}"></div></span><span><span class="sa" style="color:${a?a.color:'#00d4ff'}">${ev.agent}</span><span style="color:rgba(200,214,229,.4);font-size:11px">${taskText}</span></span>`;
              if(a)flashAgent(a.id);
              chatMsgs.scrollTop=chatMsgs.scrollHeight;break;
            }
            case 'agent_error':
              if(thinkInd){thinkInd.remove();thinkInd=null;}
              addStep('✗','rgba(255,50,50,.1)','#ff4757','',`${ev.agent}: ${ev.error}`,'#ff4757');
              break;
            case 'conclusion':
              hideTyping();
              if(thinkInd){thinkInd.remove();thinkInd=null;}
              updateDag('conclusion',ev);
              concEl.style.display='block';
              concEl.innerHTML=renderMd(ev.text);
              // 加 DAG 按钮
              const dagBtn=document.createElement('div');
              dagBtn.style.cssText='margin-top:6px;font-size:11px;color:rgba(0,180,255,.4);cursor:pointer;display:inline-block';
              dagBtn.textContent='📊 查看推理链路';
              dagBtn.onclick=()=>{
                if(currentRid)fetchDAG(currentRid,concEl);
              };
              sysMsg.querySelector('.bub').appendChild(dagBtn);
              chatMsgs.scrollTop=chatMsgs.scrollHeight;
              break;
            case 'done':
              hideTyping();sendBtn.textContent='发送';
              loadHistory();loadSessions();  // 刷新历史面板+会话列表
              const meta=document.createElement('div');
              meta.className='meta';
              meta.innerHTML=`<span>🤖 ${ev.agents_used.join('、')}</span><span>🔧 ${ev.tool_calls_count}次</span>`;
              sysMsg.querySelector('.bub').appendChild(meta);
              break;
          }
        }catch(e){/*ignore parse errors*/}
      }
    }
  }catch(e){
    hideTyping();
    addMsg('sys',`<div style="color:#ff6b6b">❌ 请求失败: ${e.message}<br><br><span style="font-size:12px;color:rgba(200,214,229,.4)">确保后端已启动: <b>uvicorn src.api.server:app --reload --port 8000</b></span></div>`);
  }
  sendBtn.disabled=false;
}

      if(!data.items||data.items.length===0){
        list.innerHTML='<div style="color:rgba(200,214,229,.2);padding:6px">暂无对话</div>';
        return;
      }
      data.items.forEach(item=>{
        const d=document.createElement('div');
        d.style.cssText='padding:4px 8px;border-radius:5px;cursor:pointer;transition:.15s;display:flex;gap:6px;align-items:flex-start';
        // 生成标题：取前20字，去除非文本前缀
        let title=item.query.replace(/^.*?用户问题[：:]\s*/,'').trim();
        if(title.length>20)title=title.slice(0,20)+'…';
        if(!title)title=item.query.slice(0,20);
        d.innerHTML=`<span style="font-size:10px;opacity:.4;flex-shrink:0">${item.time?item.time.slice(5,16):''}</span><span title="${item.query.replace(/"/g,'&quot;')}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${title}</span>`;
        d.onmouseover=()=>{d.style.background='rgba(0,180,255,.06)'};
        d.onmouseout=()=>{d.style.background=''};
        d.onclick=()=>{chatInp.value=item.query;ask(item.query)};
        list.appendChild(d);
      });
    }).catch(()=>{});
}
loadHistory();
loadSessions();

// ========== DAG Visualization ==========
function fetchDAG(requestId,container){
  if(container.querySelector('.dag-wrap'))return;
  const wrap=document.createElement('div');wrap.className='dag-wrap';
  wrap.style.cssText='margin-top:8px;border-top:1px solid rgba(0,180,255,.08);padding-top:8px';
  wrap.innerHTML='<div style="font-size:11px;color:rgba(200,214,229,.3);margin-bottom:4px">⏳ 加载推理链路...</div>';
  container.appendChild(wrap);
  fetch(API_URL.replace('/api/query','/api/trace/'+requestId))
    .then(r=>r.json()).then(data=>{
      if(!data.nodes||data.nodes.length===0){
        wrap.innerHTML='<div style="font-size:11px;color:rgba(200,214,229,.2)">无工具调用记录</div>';
        return;
      }
      drawDAG(data.nodes,wrap);
    }).catch(()=>{
      wrap.innerHTML='<div style="font-size:11px;color:rgba(200,214,229,.2)">加载失败</div>';
    });
}
function drawDAG(nodes,container){
  const colors={};
  const agents=[...new Set(nodes.map(n=>n.agent))];
  const palette=['#00b4ff','#ffa500','#00ff88','#a855f7','#ff6b6b'];
  agents.forEach((a,i)=>{colors[a]=palette[i%palette.length];});
  // Build group by agent
  const groups={};
  nodes.forEach(n=>{
    if(!groups[n.agent])groups[n.agent]=[];
    groups[n.agent].push(n);
  });
  const agentList=Object.keys(groups);
  // Render as simple HTML flow (not canvas for simplicity)
  let html='<div style="font-size:11px;line-height:1.6">';
  agentList.forEach(agent=>{
    const tools=groups[agent];
    html+=`<div style="margin-bottom:6px"><span style="color:${colors[agent]};font-weight:600">${agent}</span>`;
    tools.forEach((t,i)=>{
      const isLast=i===tools.length-1;
      html+=`<div style="display:flex;align-items:flex-start;gap:6px;padding:3px 0 3px 14px">`;
      html+=`<span style="color:${colors[agent]};font-size:10px;flex-shrink:0">${isLast?'└─':'├─'}</span>`;
      html+=`<span style="background:${colors[agent]}15;border:1px solid ${colors[agent]}22;border-radius:4px;padding:2px 8px;flex:1;font-size:11px">`;
      html+=`<span style="font-weight:600">🔧 ${t.tool}</span>`;
      html+=`<span style="color:rgba(200,214,229,.3);font-size:10px;margin-left:6px">${t.duration_ms}ms</span>`;
      if(t.input)html+=`<div style="font-size:10px;color:rgba(200,214,229,.4)">${t.input.slice(0,40)}</div>`;
      html+=`</span></div>`;
    });
    html+=`</div>`;
  });
  html+='</div>';
  container.innerHTML=html;
}

function showDebateModal(){
  document.getElementById('debateModal').style.display='flex';
  document.getElementById('debateInput').focus();
}
function closeDebateModal(){
  document.getElementById('debateModal').style.display='none';
}
function submitDebate(){
  const q=document.getElementById('debateInput').value.trim();
  if(!q)return;
  closeDebateModal();
  startDebate(q);
}
