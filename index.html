<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>粮库多智能体系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080c1a;color:#c8d6e5;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;height:100vh;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,180,255,.03)1px,transparent 1px),linear-gradient(90deg,rgba(0,180,255,.03)1px,transparent 1px);background-size:30px 30px;pointer-events:none;z-index:0}

.header{position:relative;z-index:10;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,180,255,.1);background:rgba(8,12,26,.85);backdrop-filter:blur(12px)}
.header h1{font-size:17px;font-weight:700;background:linear-gradient(135deg,#00b4ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .status{display:flex;align-items:center;gap:8px;font-size:12px;color:#4a9}
.dot-live{width:7px;height:7px;border-radius:50%;background:#00ff88;box-shadow:0 0 10px #00ff8866;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status .key{color:rgba(200,214,229,.3);font-size:11px}

.main{position:relative;z-index:1;display:flex;height:calc(100vh - 54px)}

/* Left: Agent Network */
.network-panel{width:380px;min-width:300px;display:flex;flex-direction:column;padding:14px;gap:10px;border-right:1px solid rgba(0,180,255,.06)}
.panel-title{font-size:11px;color:rgba(200,214,229,.3);letter-spacing:1px}
.network-canvas-wrap{flex:1;background:rgba(12,20,40,.4);border-radius:12px;border:1px solid rgba(0,180,255,.06);overflow:hidden;min-height:200px}
.network-canvas-wrap canvas{width:100%;height:100%;display:block}
.agent-strip{display:flex;gap:6px}
.agent-chip{flex:1;display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:8px;background:rgba(12,20,40,.5);border:1px solid rgba(0,180,255,.06);font-size:10px;transition:.2s}
.agent-chip .dot{width:5px;height:5px;border-radius:50%}

/* Right: Chat */
.chat-panel{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-msgs{flex:1;overflow-y:auto;padding:14px 20px;display:flex;flex-direction:column;gap:12px}
.chat-msgs::-webkit-scrollbar{width:4px}
.chat-msgs::-webkit-scrollbar-thumb{background:rgba(0,180,255,.15);border-radius:2px}

.msg{max-width:90%;display:flex;gap:10px;animation:in .35s ease-out;flex-shrink:0}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.sys{align-self:flex-start}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.msg .av{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.msg.user .av{background:rgba(0,180,255,.15)}
.msg.sys .av{background:rgba(0,255,136,.1)}
.msg .bub{padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.7}
.msg.user .bub{background:rgba(0,180,255,.12);border:1px solid rgba(0,180,255,.15);color:#e0ecff}
.msg.sys .bub{background:rgba(12,20,40,.6);border:1px solid rgba(0,180,255,.06);color:#c8d6e5}
.msg .bub table{border-collapse:collapse;width:100%;margin:6px 0;font-size:12px}
.msg .bub th,.msg .bub td{padding:5px 8px;border:1px solid rgba(0,180,255,.1);text-align:center}
.msg .bub th{background:rgba(0,180,255,.08);color:#00d4ff;font-weight:600}
.msg .bub td{background:rgba(0,180,255,.02)}
.msg .bub code{background:rgba(0,180,255,.08);padding:1px 5px;border-radius:3px;font-size:12px;color:#00d4ff}
.msg .bub pre code{display:block;padding:8px 12px;background:rgba(0,0,0,.3);border:1px solid rgba(0,180,255,.06);border-radius:6px;overflow-x:auto}
.msg .bub h1,.msg .bub h2,.msg .bub h3{margin:8px 0 4px;color:#e0ecff}
.msg .bub h2{font-size:15px;border-bottom:1px solid rgba(0,180,255,.06);padding-bottom:4px}
.msg .bub h3{font-size:14px}
.msg .bub strong{color:#e0ecff}
.msg .bub hr{border:none;border-top:1px solid rgba(0,180,255,.06);margin:8px 0}

/* Reasoning steps inside bubble */
.steps{margin-top:8px;border-top:1px solid rgba(0,180,255,.08);padding-top:8px}
.step{display:flex;align-items:flex-start;gap:8px;padding:3px 0;font-size:12px;line-height:1.5;opacity:0;animation:fs .3s forwards}
.step .sn{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;margin-top:1px}
.step .sa{font-weight:600;margin-right:4px}
.step .st{color:rgba(0,180,255,.5);font-size:11px}
.step .sm{color:rgba(200,214,229,.65)}
@keyframes fs{to{opacity:1}}
.thinking-dots{color:rgba(200,214,229,.4);font-size:12px;animation:pulse 1.5s infinite}
.sys .conc{margin-top:8px;padding:8px 12px;border-radius:6px;background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.12);font-size:13px;color:#8fecb0;line-height:1.6}
.sys .conc::before{content:'✅ ';color:#00ff88;font-weight:600}
.sys .meta{display:flex;gap:10px;margin-top:6px;font-size:11px;color:rgba(200,214,229,.25)}

/* Typing */
.typing{display:none;gap:8px;align-items:center;padding:6px 0}
.typing.show{display:flex}
.typing .td{display:flex;gap:4px}
.typing .td span{width:6px;height:6px;border-radius:50%;background:rgba(0,180,255,.4);animation:db 1.4s infinite}
.typing .td span:nth-child(2){animation-delay:.2s}
.typing .td span:nth-child(3){animation-delay:.4s}
@keyframes db{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.typing .tt{font-size:12px;color:rgba(200,214,229,.25);margin-left:6px}

/* Quick questions */
.quick{padding:6px 20px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid rgba(0,180,255,.04)}
.quick .qc{padding:5px 12px;border-radius:14px;background:rgba(0,180,255,.05);border:1px solid rgba(0,180,255,.08);font-size:11px;color:rgba(200,214,229,.4);cursor:pointer;transition:.2s}
.quick .qc:hover{background:rgba(0,180,255,.1);color:#c8d6e5;border-color:rgba(0,180,255,.18)}

/* Input */
.inp{display:flex;gap:8px;padding:10px 20px 14px;border-top:1px solid rgba(0,180,255,.04)}
.inp input{flex:1;padding:10px 14px;border-radius:8px;border:1px solid rgba(0,180,255,.1);background:rgba(12,20,40,.5);color:#c8d6e5;font-size:13px;outline:none;transition:.2s}
.inp input::placeholder{color:rgba(200,214,229,.15)}
.inp input:focus{border-color:rgba(0,180,255,.25);box-shadow:0 0 12px rgba(0,180,255,.05)}
.inp button{padding:10px 22px;border:none;border-radius:8px;background:linear-gradient(135deg,#00b4ff,#0090dd);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.inp button:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,180,255,.2)}
.inp button:disabled{opacity:.3;cursor:not-allowed;transform:none}

@media(max-width:860px){.network-panel{width:100%;max-height:220px;border-right:none;border-bottom:1px solid rgba(0,180,255,.06)}.main{flex-direction:column}}
</style>
</head>
<body>

<div class="header">
  <h1>🌾 粮库多智能体系统</h1>
  <div class="status"><span class="dot-live"></span> 运行中 · <span class="key" id="apiStatus">后端未连接</span> · <a href="dashboard.html" style="color:rgba(0,180,255,.5);text-decoration:none;font-size:11px;margin-left:4px">🌐 3D 大屏</a></div>
</div>

<div class="main">
  <div class="network-panel">
    <div class="panel-title">⚡ AGENT 协同网络</div>
    <div class="network-canvas-wrap"><canvas id="netCanvas"></canvas></div>
    <div class="agent-strip" id="agentStrip"></div>
  </div>

  <div class="chat-panel">
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="typing" id="typing"><div class="td"><span></span><span></span><span></span></div><span class="tt">Agent 协同分析中...</span></div>
    <div class="quick" id="quickQs"></div>
    <div class="inp">
      <input id="chatInp" placeholder="输入问题，例如：S-07仓是否满足通风条件？" autofocus>
      <button id="sendBtn">发送</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@11.0.0/marked.min.js"></script>
<script>
// ========== Config ==========
const API_URL = 'http://localhost:8000/api/query';
const API_STREAM = 'http://localhost:8000/api/query/stream';
const AGENTS = [
  {id:0,name:'粮情分析',icon:'🌡',color:'#00b4ff'},
  {id:1,name:'智能作业',icon:'⚙',color:'#ffa500'},
  {id:2,name:'出入库',icon:'🚛',color:'#00ff88'},
  {id:3,name:'报表分析',icon:'📋',color:'#a855f7'},
];

// ========== Canvas ==========
const canvas = document.getElementById('netCanvas');
const ctx = canvas.getContext('2d');
let W,H,activeAgent=-1,animFrame;

function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  if(!r.width)return;
  canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;
  canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';
  ctx.scale(devicePixelRatio,devicePixelRatio);W=r.width;H=r.height;
}
resize();window.addEventListener('resize',resize);

function draw(){
  const r=canvas.parentElement.getBoundingClientRect();
  if(!r.width){animFrame=requestAnimationFrame(draw);return}
  resize();
  const cx=W*.48,cy=H*.48,orbit=Math.min(W,H)*.3,t=Date.now()/3000;
  ctx.clearRect(0,0,W,H);
  const nodes=AGENTS.map((a,i)=>{const an=-Math.PI/2+i*Math.PI/2;return{x:cx+Math.cos(an)*orbit,y:cy+Math.sin(an)*orbit*.85,r:34,id:i}});
  const center={x:cx,y:cy-4,r:40};
  for(const n of nodes){
    ctx.strokeStyle='rgba(0,180,255,.05)';ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(center.x,center.y);ctx.stroke();
    const fp=(Math.sin(t+n.id*2)+1)/2;
    ctx.fillStyle=n.id===activeAgent?'rgba(0,255,136,.35)':'rgba(0,180,255,.12)';
    ctx.beginPath();ctx.arc(n.x+(center.x-n.x)*fp,n.y+(center.y-n.y)*fp,2,0,Math.PI*2);ctx.fill();
  }
  for(const n of[...nodes,center]){
    const isC=n.id===undefined,agent=isC?null:AGENTS[n.id],isA=n.id===activeAgent;
    const pulse=isC?1:(1+Math.sin(Date.now()/1500+(n.id||0))*.05),rr=n.r*pulse;
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,rr*2);
    if(isC)g.addColorStop(0,`rgba(0,180,255,${isA?.1:.05})`);
    else{const rgb=agent.color==='#00b4ff'?'0,180,255':agent.color==='#ffa500'?'255,165,0':agent.color==='#00ff88'?'0,255,136':'168,85,247';g.addColorStop(0,`rgba(${rgb},${isA?.18:.07})`)}
    g.addColorStop(1,'rgba(0,180,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,rr*2,0,Math.PI*2);ctx.fill();
    const gd=ctx.createRadialGradient(n.x-rr*.2,n.y-rr*.2,0,n.x,n.y,rr);
    if(isC){gd.addColorStop(0,`rgba(0,180,255,${isA?.22:.1})`);gd.addColorStop(1,'rgba(0,180,255,.03)');ctx.strokeStyle=`rgba(0,180,255,${isA?.45:.22})`}
    else{const rgb=agent.color==='#00b4ff'?'0,180,255':agent.color==='#ffa500'?'255,165,0':agent.color==='#00ff88'?'0,255,136':'168,85,247';gd.addColorStop(0,`rgba(${rgb},${isA?.3:.12})`);gd.addColorStop(1,`rgba(${rgb},.03)`);ctx.strokeStyle=`rgba(${rgb},${isA?.45:.18})`}
    ctx.fillStyle=gd;ctx.lineWidth=isA?1.8:1;ctx.beginPath();ctx.arc(n.x,n.y,rr,0,Math.PI*2);ctx.fill();ctx.stroke();
    if(isA){ctx.strokeStyle='rgba(0,255,136,.2)';ctx.lineWidth=1;ctx.setLineDash([3,5]);ctx.beginPath();ctx.arc(n.x,n.y,rr+5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(isC){ctx.font='18px sans-serif';ctx.fillText('🧠',n.x,n.y-1);ctx.fillStyle='rgba(200,214,229,.35)';ctx.font='8px sans-serif';ctx.fillText('Orchestrator',n.x,n.y+15)}
    else{ctx.font='17px sans-serif';ctx.fillText(agent.icon,n.x,n.y-1);ctx.fillStyle=isA?agent.color:'rgba(200,214,229,.3)';ctx.font=isA?'bold 9px sans-serif':'8px sans-serif';ctx.fillText(agent.name,n.x,n.y+rr+10)}
  }
  animFrame=requestAnimationFrame(draw);
}
draw();

// Agent strip
const strip=document.getElementById('agentStrip');
AGENTS.forEach(a=>{
  const d=document.createElement('div');d.className='agent-chip';
  d.innerHTML=`<span class="dot" style="background:${a.color}"></span><span>${a.icon} ${a.name}</span>`;
  strip.appendChild(d);
});
function flashAgent(id){
  activeAgent=id;
  strip.querySelectorAll('.agent-chip').forEach((c,i)=>{c.style.borderColor=i===id?AGENTS[id].color:'';c.style.background=i===id?AGENTS[id].color+'15':''});
}
function clearFlash(){activeAgent=-1;strip.querySelectorAll('.agent-chip').forEach(c=>{c.style.borderColor='';c.style.background=''})}

// ========== Chat ==========
const chatMsgs=document.getElementById('chatMsgs');
const chatInp=document.getElementById('chatInp');
const sendBtn=document.getElementById('sendBtn');
const typing=document.getElementById('typing');
const apiStatus=document.getElementById('apiStatus');

function escapeHtml(text){
  const d=document.createElement('div');d.textContent=text;return d.innerHTML;
}
function renderMd(text){
  try{return marked.parse(text,{breaks:true,gfm:true})}catch(e){return escapeHtml(text)}
}
function addMsg(type,content){
  const d=document.createElement('div');d.className=`msg ${type}`;
  const av=type==='user'?'👤':'🧠',bg=type==='user'?'rgba(0,180,255,.15)':'rgba(0,255,136,.1)';
  const html=type==='user'?escapeHtml(content):renderMd(content);
  d.innerHTML=`<div class="av" style="background:${bg}">${av}</div><div class="bub">${html}</div>`;
  chatMsgs.appendChild(d);chatMsgs.scrollTop=chatMsgs.scrollHeight;
  return d;
}

function addResultMsg(steps,conclusion,agentsUsed,toolCount,elapsed){
  const d=document.createElement('div');d.className='msg sys';
  let html=`<div class="av" style="background:rgba(0,255,136,.1)">🧠</div><div class="bub"><div style="font-size:12px;color:rgba(200,214,229,.35);margin-bottom:6px">⚡ 多 Agent 协同推理</div><div class="steps">`;
  steps.forEach((s,i)=>{
    const a=AGENTS.find(x=>x.name===s.agent)||AGENTS[0];
    const toolText=s.tool?s.tool:'';
    html+=`<div class="step" style="animation-delay:${i*.12}s"><span class="sn" style="background:${a.color}22;color:${a.color}">${i+1}</span><span><span class="sa" style="color:${a.color}">${a.icon} ${s.agent}</span>${toolText?` <span class="st">◆ ${toolText}</span>`:''}<div class="sm">${s.msg}</div></span></div>`;
  });
  html+=`</div><div class="conc">${conclusion}</div><div class="meta"><span>🤖 ${agentsUsed.join('、')}</span><span>🔧 ${toolCount} 次调用</span><span>⏱ ${elapsed}s</span></div></div>`;
  d.innerHTML=html;chatMsgs.appendChild(d);chatMsgs.scrollTop=chatMsgs.scrollHeight;
}

function showTyping(){typing.classList.add('show')}
function hideTyping(){typing.classList.remove('show')}

// ========== API Call (Streaming SSE) ==========
async function ask(query){
  if(!query.trim())return;
  addMsg('user',query);
  chatInp.value='';sendBtn.disabled=true;showTyping();

  // Create streaming message container
  const sysMsg=document.createElement('div');sysMsg.className='msg sys';
  sysMsg.innerHTML=`<div class="av" style="background:rgba(0,255,136,.1)">🧠</div><div class="bub"><div style="font-size:12px;color:rgba(200,214,229,.35);margin-bottom:6px">⚡ 多 Agent 协同推理</div><div class="steps" id="streamSteps"></div><div class="conc" id="streamConc" style="display:none"></div></div>`;
  chatMsgs.appendChild(sysMsg);chatMsgs.scrollTop=chatMsgs.scrollHeight;
  const stepsEl=document.getElementById('streamSteps');
  const concEl=document.getElementById('streamConc');

  function addStep(icon,iconBg,iconColor,label,msg,color){
    const d=document.createElement('div');d.className='step';d.style.animationDelay='0s';
    d.innerHTML=`<span class="sn" style="background:${iconBg};color:${iconColor}">${icon}</span><span>${label?`<span class="sa" style="color:${color||'#c8d6e5'}">${label}</span> `:''}${msg?`<div class="sm">${msg}</div>`:''}</span>`;
    stepsEl.appendChild(d);
  }

  try{
    const res=await fetch(API_STREAM,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query})
    });
    hideTyping();
    if(!res.ok)throw new Error(`HTTP ${res.status}`);

    const reader=res.body.getReader();
    const decoder=new TextDecoder();
    let buffer='';

    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const parts=buffer.split('\n\n');
      buffer=parts.pop()||'';
      for(const part of parts){
        if(!part.startsWith('data: '))continue;
        try{
          const ev=JSON.parse(part.slice(6));
          switch(ev.type){
            case 'plan':
              addStep('📋','rgba(0,180,255,.1)','#00d4ff','Orchestrator',`🎯 ${ev.scenario} · 请求 ${ev.request_id}`,'#00d4ff');
              break;
            case 'step':
              addStep(`S${ev.step}`,'rgba(0,255,136,.1)','#00ff88','',`${ev.mode} · ${ev.desc}`,'#00ff88');
              break;
            case 'agent_start':{
              const a=AGENTS.find(x=>x.name===ev.agent);
              addStep('▶',a?a.color+'22':'rgba(0,180,255,.1)',a?a.color:'#00d4ff',ev.agent,ev.task,a?a.color:'#00d4ff');
              if(a)flashAgent(a.id);
              chatMsgs.scrollTop=chatMsgs.scrollHeight;break;
            }
            case 'tool_calls':
              {const te=document.getElementById('thinkInd');if(te)te.remove();}
              for(const tc of ev.calls)
                addStep('🔧','transparent','rgba(0,180,255,.4)','',`${tc.tool}(${tc.input})`,'rgba(0,180,255,.5)');
              chatMsgs.scrollTop=chatMsgs.scrollHeight;break;
            case 'agent_done':
              clearFlash();
              {const te=document.getElementById('thinkInd');if(te)te.remove();}
              addStep('✓','rgba(0,255,136,.1)','#00ff88','',`${ev.agent} 完成 (${ev.elapsed}s, ${ev.tool_count}次)`,'rgba(200,214,229,.4)');
              chatMsgs.scrollTop=chatMsgs.scrollHeight;break;
            case 'thinking':{
              // 显示或更新思考中指示器（持续动画直到下个事件覆盖）
              let tip=document.getElementById('thinkInd');
              if(!tip){
                tip=document.createElement('div');tip.id='thinkInd';tip.className='step';tip.style.animationDelay='0s';
                stepsEl.appendChild(tip);
              }
              const a=AGENTS.find(x=>x.name===ev.agent);
              const taskText=ev.task?' · '+ev.task:'';
              tip.innerHTML=`<span class="sn" style="background:${a?a.color+'22':'rgba(0,180,255,.1)'};color:${a?a.color:'#00d4ff'}">⏳</span><span><span class="sa" style="color:${a?a.color:'#00d4ff'}">${ev.agent}</span><span class="thinking-dots">${taskText}</span></span>`;
              if(a)flashAgent(a.id);
              chatMsgs.scrollTop=chatMsgs.scrollHeight;break;
            }
            case 'agent_error':
              // 移除 thinking 指示器
              const te=document.getElementById('thinkInd');if(te)te.remove();
              addStep('✗','rgba(255,50,50,.1)','#ff4757','',`${ev.agent}: ${ev.error}`,'#ff4757');
              break;
            case 'conclusion':
              {const te=document.getElementById('thinkInd');if(te)te.remove();}
              concEl.style.display='block';
              concEl.innerHTML=renderMd(ev.text);
              chatMsgs.scrollTop=chatMsgs.scrollHeight;
              break;
            case 'done':
              const meta=document.createElement('div');
              meta.className='meta';
              meta.innerHTML=`<span>🤖 ${ev.agents_used.join('、')}</span><span>🔧 ${ev.tool_calls_count}次</span>`;
              sysMsg.querySelector('.bub').appendChild(meta);
              break;
          }
        }catch(e){/*ignore parse errors*/}
      }
    }
  }catch(e){
    hideTyping();
    addMsg('sys',`<div style="color:#ff6b6b">❌ 请求失败: ${e.message}<br><br><span style="font-size:12px;color:rgba(200,214,229,.4)">确保后端已启动: <b>uvicorn src.api.server:app --reload --port 8000</b></span></div>`);
  }
  sendBtn.disabled=false;
}

// Events
sendBtn.addEventListener('click',()=>ask(chatInp.value));
chatInp.addEventListener('keydown',e=>{if(e.key==='Enter')ask(chatInp.value)});

// Quick questions
const Qs=[{t:'🌡 S-07满足通风条件？'},{t:'📊 最近粮情有什么异常？'},{t:'🚛 今天出入库情况？'},{t:'📋 生成今日库存日报'},{t:'🐛 S-03需要熏蒸吗？'}];
const qsEl=document.getElementById('quickQs');
Qs.forEach(q=>{
